# Managed by rezize CI/CD. Edit in the rezize dashboard.
name: rezize-ci
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build-and-deploy:
    runs-on: [self-hosted, rezize]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t devops-frontend:latest -f Dockerfile .
      - name: Deploy container
        run: |
          docker rm -f devops-frontend 2>/dev/null || true
          docker run -d --name devops-frontend --restart unless-stopped \
            -p 8080:8080 devops-frontend:latest
